# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                    SALIDAS Y RENDERIZADO                   │
# ╘═════════════════════════════════════════════════════════════╛
# Configuración global de salidas: subpixel, adaptive sync y renderizado.

# ──「 ESCALADO DE SALIDAS 」─────────────────────────────────
# Listar salidas: swaymsg -t get_outputs

# ──「 RENDERIZADO DE FUENTES 」──────────────────────────────
  output * subpixel none

# ╒═════════════════════════════════════════════════════════════╕
# │                  MONITORES DE ALTO REFRESCO                │
# ╘═════════════════════════════════════════════════════════════╛
# ──「 ADAPTIVE SYNC 」───────────────────────────────────────
# Variable Refresh Rate. Puede causar flickering en algunos monitores.
# Para aplicar por monitor: output DP-1 adaptive_sync on
  output * adaptive_sync on

# ──「 MAX RENDER TIME 」─────────────────────────────────────
# Tiempo máximo de composición (off = por defecto, 2-6ms = baja latencia).
# Para ajustar: swaymsg output * max_render_time 1, incrementar si hay frame drops.
  output * max_render_time off
