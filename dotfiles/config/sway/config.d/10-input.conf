# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                 VARIABLES Y DISPOSITIVOS DE ENTRADA         │
# ╘═════════════════════════════════════════════════════════════╛

# ── VARIABLES ─────────────────────────────────────────────────
  set $mod   Mod4
  set $left  h
  set $down  j
  set $up    k
  set $right l
  floating_modifier $mod

# ── DISTRIBUCIÓN DE TECLADO ───────────────────────────────────
  input type:keyboard {
  xkb_layout  latam,us
  xkb_options grp:alt_shift_toggle
# repeat_delay 300   PEND: cuando haya mejor teclado
# repeat_rate 50
  }

# ── TOUCHPAD / CLICK ──────────────────────────────────────────
  input type:touchpad {
  scroll_method edge
# dwt enabled
# tap enabled
# middle_emulation enabled
  }
