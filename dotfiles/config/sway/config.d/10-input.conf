# vim: filetype=swayconfig
# ╒══════════════════════════════════════════════════════════╕
# │                 DISPOSITIVOS DE ENTRADA                   │
# ╘══════════════════════════════════════════════════════════╛
# Dispositivos de entrada. Las variables de teclado viven en 05-variables.conf.

# ──「 DISTRIBUCIÓN DE TECLADO 」─────────────────────────────
  input type:keyboard {
  xkb_layout  latam,us
  xkb_options grp:alt_shift_toggle
# repeat_delay 300   PEND: cuando haya mejor teclado
# repeat_rate 50
  }

# ──「 TOUCHPAD 」────────────────────────────────────────────
  input type:touchpad {
  scroll_method two_finger
# dwt enabled
# tap enabled
# middle_emulation enabled
  }
