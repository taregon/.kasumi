# vim: filetype=swayconfig
# ╒══════════════════════════════════════════════════════════╕
# │                     EFECTOS VISUALES                     │
# ╘══════════════════════════════════════════════════════════╛
# Extensiones SwayFX: blur, sombras, esquinas redondeadas, atenuación.

# ──「 RADIO DE ESQUINAS 」───────────────────────────────────
  corner_radius              0
  smart_corner_radius        enable

# ──「 SOMBRAS 」─────────────────────────────────────────────
  shadows                    enable
  shadows_on_csd             enable
  shadow_blur_radius         12
  shadow_color               #6a9fa7cc
  shadow_inactive_color      #2E383DD4
  shadow_offset              0 0

# ──「 DESENFOQUE 」──────────────────────────────────────────
  blur                       enable
  blur_xray                  disable
  blur_radius                1
  blur_passes                5
  blur_noise                 0.04
# blur_saturation            0.10
  blur_brightness            0.92
  blur_contrast              1.08

# ──「 ATENUACIÓN INACTIVA 」─────────────────────────────────
  default_dim_inactive          0.08
  dim_inactive_colors.unfocused #00000080
  dim_inactive_colors.urgent    #FFA563c4

# ──「 EFECTOS DE CAPA 」─────────────────────────────────────
# Namespaces: swaymsg -r -t get_outputs | jq '.[0].layer_shell_surfaces | .[] | .namespace'
  layer_effects "waybar" {
  blur enable;
  blur_xray enable;
  shadows disable;
# corner_radius 4;
  }

  layer_effects "rofi" {
  blur enable;
  shadows enable;
  }
