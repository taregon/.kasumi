# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                   VARIABLES DE ENTORNO                     │
# ╘═════════════════════════════════════════════════════════════╛
# Exporta variables Wayland a systemd --user y D-Bus.
# Requerido cuando Sway se inicia desde TTY o apps usan servicios D-Bus.

  exec systemctl --user import-environment \
  WAYLAND_DISPLAY \
  XDG_CURRENT_DESKTOP \
  XDG_SESSION_TYPE \
  SWAYSOCK

  exec dbus-update-activation-environment --systemd \
  WAYLAND_DISPLAY \
  XDG_CURRENT_DESKTOP \
  XDG_SESSION_TYPE \
  SWAYSOCK
