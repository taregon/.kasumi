# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                   APARIENCIA Y BORDES                       │
# ╘═════════════════════════════════════════════════════════════╛
# Probar temporalmente con:
# swaymsg gaps outer current set 8
# swaymsg gaps inner all set 8
  default_border          pixel 3
  default_floating_border pixel 6
  gaps                    outer 4
  gaps                    inner 8
  smart_gaps              off
  smart_borders           off
  font                    pango:JetbrainsMono Nerd Font 10

# ╒═════════════════════════════════════════════════════════════╕
# │                       TEMAS DE COLOR                        │
# ╘═════════════════════════════════════════════════════════════╛
# Bordes de ventanas
  set $accent_focus  #5dbdc9
  set $accent_idle   #4a565e
  set $accent_urgent #ffa563

# Fondos de pestañas
  set $bg_focus      #326d7d
  set $bg_idle       #2e383d
  set $bg_urgent     #8b6044

# Bordes de pestañas
  set $border_focus  #72b8cb
  set $border_idle   #4a565e
  set $border_urgent #ffb077

# Texto de pestañas
  set $text_focus    #9de4f8
  set $text_idle     #7a8a94
  set $text_urgent   #ffcba4

  client.focused   $border_focus  $bg_focus  $text_focus  $bg_focus  $accent_focus
  client.unfocused $border_idle   $bg_idle   $text_idle   $bg_idle   $accent_idle
  client.urgent    $border_urgent $bg_urgent $text_urgent $bg_urgent $accent_urgent

# ── GTK THEME ─────────────────────────────────────────────────
  set $gnome-schema org.gnome.desktop.interface
  exec_always {
#    gsettings set $gnome-schema gtk-theme 'Nightfox-Dusk-B'
#    gsettings set $gnome-schema icon-theme 'Flat-Remix-Blue-Dark'
#    gsettings set $gnome-schema cursor-theme 'Bibata-Modern-Ice'
#    gsettings set $gnome-schema font-name 'SF Pro Display'

# Recomendados para dark mode y Firefox
#    gsettings $gnome-schema color-scheme 'prefer-dark'
#    gsettings $gnome-schema gtk-application-prefer-dark-theme true
  }

# ╒═════════════════════════════════════════════════════════════╕
# │                    EFECTOS VISUALES (SwayFX)                │
# ╘═════════════════════════════════════════════════════════════╛
# Compositor Wayland compatible con Sway que añade efectos visuales
# como blur, sombras, esquinas redondeadas y atenuación de ventanas.

# ─[ CORNER RADIUS ]──────────────────────────────────────────
  corner_radius              0
  smart_corner_radius        enable

# ─[ SHADOWS ]────────────────────────────────────────────────
  shadows                    enable
  shadows_on_csd             enable
  shadow_blur_radius         12
  shadow_color               #6a9fa7cc
  shadow_inactive_color      #2E383DD4
  shadow_offset              0 0

# ─[ BLUR ]───────────────────────────────────────────────────
  blur                       enable
  blur_xray                  disable
  blur_radius                1
  blur_passes                5
  blur_noise                 0.04
#  blur_saturation            0.10
  blur_brightness            0.92
  blur_contrast              1.08

# ─[ DIM INACTIVE ]───────────────────────────────────────────
  default_dim_inactive          0.08
  dim_inactive_colors.unfocused #00000080
  dim_inactive_colors.urgent    #FFA563c4

# ─[ LAYER EFFECTS ]──────────────────────────────────────────
# Configuración de efectos para superficies layer-shell
#   Lista los namespaces layer-shell detectados por SwayFX (útil para layer_effects)
#   swaymsg -r -t get_outputs | jq '.[0].layer_shell_surfaces | .[] | .namespace'

  layer_effects "waybar" {
  blur enable;
  blur_xray enable;
  shadows disable;
#  corner_radius 4;
  }

  layer_effects "rofi" {
  blur enable;
  shadows enable;
  }
