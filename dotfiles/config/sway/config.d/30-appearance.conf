# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                     APARIENCIA Y BORDES                    │
# ╘═════════════════════════════════════════════════════════════╛
# Bordes, gaps, fuentes y colores de ventanas.
# Para ajustar gaps temporalmente: swaymsg gaps outer current set 8

  default_border          pixel 3
  default_floating_border pixel 6
  gaps                    outer 4
  gaps                    inner 8
  smart_gaps              off
  smart_borders           off
  font                    pango:JetBrainsMono Nerd Font 10

# ╒═════════════════════════════════════════════════════════════╕
# │                       TEMAS DE COLOR                       │
# ╘═════════════════════════════════════════════════════════════╛
# Colores de ventanas (border bg text indicator child_border).
# Paleta de colores definida en 05-variables.conf.
  client.focused   $border_focus  $bg_focus  $text_focus  $bg_focus  $accent_focus
  client.unfocused $border_idle   $bg_idle   $text_idle   $bg_idle   $accent_idle
  client.urgent    $border_urgent $bg_urgent $text_urgent $bg_urgent $accent_urgent

# ──「 TEMA GTK 」────────────────────────────────────────────
# Descomentar para activar.
  set $gnome-schema org.gnome.desktop.interface
  exec_always {
