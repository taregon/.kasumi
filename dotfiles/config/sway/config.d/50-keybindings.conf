# vim: filetype=swayconfig
# ╒══════════════════════════════════════════════════════════╕
# │                    ATAJOS DE TECLADO                     │
# ╘══════════════════════════════════════════════════════════╛
# Fuente única para bindsym; helper-keybinds se genera a partir de este archivo.

  set $scripts ~/.config/sway/scripts
# Variables de aplicaciones
  set $browser          firefox
  set $keepass          keepassxc
  set $colorpicker      hyprpicker --autocopy
  set $filemanager      thunar
  set $launcher         rofi -show drun
  set $music            kitty -e rmpc
  set $term             kitty
  set $mdeditor         obsidian
#  set $logout

# ╒══════════════════════════════════════════════════════════╕
# │                       APLICACIONES                       │
# ╘══════════════════════════════════════════════════════════╛
  bindsym $mod+Return                exec $term
  bindsym $mod+m                     exec $music
  bindsym $mod+n                     exec $launcher
  bindsym $mod+o                     exec $mdeditor
  bindsym $mod+p                     exec $colorpicker
  bindsym $mod+t                     exec $filemanager
  bindsym $mod+x                     exec $keepass

# ╒══════════════════════════════════════════════════════════╕
# │                   ESPACIOS DE TRABAJO                    │
# ╘══════════════════════════════════════════════════════════╛
  bindsym $mod+0 workspace number 10
  bindsym $mod+1 workspace number 1
  bindsym $mod+2 workspace number 2
  bindsym $mod+3 workspace number 3
  bindsym $mod+4 workspace number 4
  bindsym $mod+5 workspace number 5
  bindsym $mod+6 workspace number 6
  bindsym $mod+7 workspace number 7
  bindsym $mod+8 workspace number 8
  bindsym $mod+9 workspace number 9
  bindsym $mod+Shift+0 move container to workspace number 10
  bindsym $mod+Shift+1 move container to workspace number 1
  bindsym $mod+Shift+2 move container to workspace number 2
  bindsym $mod+Shift+3 move container to workspace number 3
  bindsym $mod+Shift+4 move container to workspace number 4
  bindsym $mod+Shift+5 move container to workspace number 5
  bindsym $mod+Shift+6 move container to workspace number 6
  bindsym $mod+Shift+7 move container to workspace number 7
  bindsym $mod+Shift+8 move container to workspace number 8
  bindsym $mod+Shift+9 move container to workspace number 9

# ╒══════════════════════════════════════════════════════════╕
# │                   GESTIÓN DE VENTANAS                    │
# ╘══════════════════════════════════════════════════════════╛
  bindsym $mod+$left        focus      left
  bindsym $mod+$down        focus      down
  bindsym $mod+$up          focus      up
  bindsym $mod+$right       focus      right
  bindsym $mod+Shift+$left  move       left
  bindsym $mod+Shift+$down  move       down
  bindsym $mod+Shift+$up    move       up
  bindsym $mod+Shift+$right move       right
  bindsym $mod+space        focus      mode_toggle
  bindsym $mod+a            focus      parent
  bindsym $mod+b            splith
  bindsym $mod+e            layout     toggle split
  bindsym $mod+f            fullscreen
  bindsym $mod+s            layout     stacking
  bindsym $mod+v            splitv
  bindsym $mod+w            layout     tabbed

# ╒══════════════════════════════════════════════════════════╕
# │                        SCRATCHPAD                        │
# ╘══════════════════════════════════════════════════════════╛
# Almacenar y recuperar ventanas en un drawer oculto.
# Flujo: enviar (Shift+Minus) → mostrar (Minus) → extraer (Shift+Space)
  bindsym $mod+Shift+minus  move       scratchpad
  bindsym $mod+minus        scratchpad show
  bindsym $mod+Shift+space  floating   toggle

# ╒══════════════════════════════════════════════════════════╕
# │                    REDIMENSIONAMIENTO                    │
# ╘══════════════════════════════════════════════════════════╛
  bindsym $mod+r            mode "resize"

  mode "resize" {
  bindsym $left  resize shrink width  60px
  bindsym $down  resize grow   height 60px
  bindsym $up    resize shrink height 60px
  bindsym $right resize grow   width  60px
  bindsym Left   resize shrink width  10px
  bindsym Down   resize grow   height 10px
  bindsym Up     resize shrink height 10px
  bindsym Right  resize grow   width  10px
  bindsym Return mode "default"
  bindsym Escape mode "default"
  }

# ╒══════════════════════════════════════════════════════════╕
# │               REDIMENSIONAMIENTO CON RATÓN               │
# ╘══════════════════════════════════════════════════════════╛
  bindsym --to-code --whole-window --border $mod+button4 resize grow width 40 px
  bindsym --to-code --whole-window --border $mod+button5 resize shrink width 40 px
  bindsym --to-code --whole-window --border $mod+shift+button4 resize shrink height 40 px
  bindsym --to-code --whole-window --border $mod+shift+button5 resize grow height 40 px

# ╒══════════════════════════════════════════════════════════╕
# │                  CAPTURAS Y UTILIDADES                   │
# ╘══════════════════════════════════════════════════════════╛
  bindsym Print                      exec $scripts/capture-screenshot region
  bindsym Shift+Print                exec $scripts/capture-screenshot swappy
  bindsym Alt+Print                  exec $scripts/capture-screenshot window
  bindsym $mod+z                     exec $scripts/system-idle lock
  bindsym $mod+Shift+n               exec $scripts/helper-file-seek

# ──「 VOLUMEN 」─────────────────────────────────────────────
  bindsym XF86AudioRaiseVolume       exec $scripts/media-control volume_up
  bindsym XF86AudioLowerVolume       exec $scripts/media-control volume_down
  bindsym XF86AudioMute              exec $scripts/media-control mute

# ──「 MULTIMEDIA 」──────────────────────────────────────────
  bindsym XF86AudioPlay              exec $scripts/media-control play_pause
  bindsym XF86AudioNext              exec $scripts/media-control next
  bindsym XF86AudioPrev              exec $scripts/media-control prev

# ──「 CALIFICACIONES RMPC 」─────────────────────────────────
# Rating states para rmpc (0=descartar, 1=regular, 2=buena, 3=excelente)
  bindsym $mod+Alt+0                 exec $scripts/media-rmpc-rating 0
  bindsym $mod+Alt+7                 exec $scripts/media-rmpc-rating 1
  bindsym $mod+Alt+8                 exec $scripts/media-rmpc-rating 2
  bindsym $mod+Alt+9                 exec $scripts/media-rmpc-rating 3

# ──「 COMPARTIR PANTALLA 」──────────────────────────────────
  bindsym $mod+y                     exec $scripts/capture-screenshare start
  bindsym $mod+Shift+y               exec $scripts/capture-screenshare stop

# ──「 GRABACIÓN 」───────────────────────────────────────────
  bindsym $mod+Print                 exec $scripts/capture-record

# ──「 BRILLO 」──────────────────────────────────────────────
  bindsym XF86MonBrightnessUp        exec $scripts/media-control l-up
  bindsym XF86MonBrightnessDown      exec $scripts/media-control l-down

# ╒══════════════════════════════════════════════════════════╕
# │                        MISCELÁNEA                        │
# ╘══════════════════════════════════════════════════════════╛
  bindsym $mod+Alt+e                 exec ~/.config/rofi/scripts/power-menu
  bindsym $mod+question              exec ~/.config/sway/scripts/helper-keybinds

# Gestión de ventanas
  bindsym $mod+Alt+r      reload
  bindsym $mod+Shift+q    kill

# Portapapeles y calculadora
#  bindsym $mod+Shift+d           exec $scripts/helper-clipboard image
#  bindsym $mod+d                 exec $scripts/helper-clipboard text

bindsym $mod+Shift+d \
  exec rofi \
    -show "󰯕  Historial de imágenes" \
    -modi "󰯕  Historial de imágenes:$HOME/.config/rofi/scripts/cliphist-modi-image" \
    -theme "~/.config/rofi/themes/cliphist-modi-image.rasi" \
    -kb-custom-1 "Alt+Delete"

bindsym $mod+d \
  exec rofi \
    -show "󰯗  Historial de texto" \
    -modi "󰯗  Historial de texto:$HOME/.config/rofi/scripts/cliphist-modi-text" \
    -theme "~/.config/rofi/themes/cliphist-modi-text.rasi" \
    -kb-custom-1 "Alt+Delete"

bindsym $mod+c \
  exec rofi \
    -show calc \
    -modi calc \
    -calc-command "printf '%s' '{result}' | wl-copy" \
    -no-show-match \
    -theme ~/.config/rofi/themes/calc-modi.rasi
