# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                   EJECUCIÓN AUTOMÁTICA                     │
# ╘═════════════════════════════════════════════════════════════╛
# Servicios que se ejecutan al inicio de la sesión.
# exec_always = se relanza en reload; exec = solo una vez.
# Nota: ~/ruta funciona en exec; en sh -c usa "$HOME"/ruta.

# Fondo: limpiar instancia previa, asegurar daemon, aplicar fondo.
  exec_always sh -c 'pkill -x swaybg'
  exec_always sh -c 'pgrep -x awww-daemon >/dev/null || awww-daemon'
  exec ~/.config/sway/scripts/system-wallpaper

# Polkit: agente de autenticación para apps con privilegios root.
  exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# swayidle: bloqueo, DPMS e inactividad.
  exec ~/.config/sway/scripts/system-idle

# Mako: daemon de notificaciones D-Bus.
  exec mako

# mpdris2-rs: puente MPD→MPRIS. -n desactiva notificaciones propias.
  exec_always sh -c 'pkill -x mpdris2-rs; mpdris2-rs -n'

# gammastep: temperatura de color según horario.
  exec gammastep

# Portapapeles: cliphist para historial wl-paste/rofi.
  exec wl-paste --type text --watch cliphist store
  exec wl-paste --type image --watch cliphist store

# Sonido de bienvenida (2s delay para PipeWire).
  exec sh -c 'sleep 2 && pw-play "$HOME/.local/share/kasumi/sounds/system/login.ogg"'

# Waybar: barra de estado (exec_always para reload y suspender/reanudar).
  exec_always sh -c 'pkill -x waybar 2>/dev/null; waybar'
