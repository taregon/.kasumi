# vim: filetype=swayconfig
# ╒═════════════════════════════════════════════════════════════╕
# │                    VARIABLES GLOBALES                      │
# ╘═════════════════════════════════════════════════════════════╛
# Fuente única de `set`. Los demás módulos consumen estas variables.
# Definidas aquí para que existan antes de cualquier uso en 10-60.

# ──「 TECLADO 」─────────────────────────────────────────────
  set $mod   Mod4
  set $left  h
  set $down  j
  set $up    k
  set $right l
  floating_modifier $mod

# ──「 RUTAS 」───────────────────────────────────────────────
  set $scripts ~/.config/sway/scripts

# ──「 APLICACIONES 」────────────────────────────────────────
  set $browser          firefox
  set $keepass          keepassxc
  set $colorpicker      hyprpicker --autocopy
  set $filemanager      thunar
  set $launcher         rofi -show drun
  set $music            kitty -e rmpc
  set $term             kitty
  set $mdeditor         obsidian

# ──「 OPACIDAD 」────────────────────────────────────────────
  set $opacity_alta 0.94
  set $opacity_baja 0.88

# ──「 COLORES 」─────────────────────────────────────────────
  set $accent_focus  #5dbdc9
  set $accent_idle   #4a565e
  set $accent_urgent #ffa563

  set $bg_focus      #326d7d
  set $bg_idle       #2e383d
  set $bg_urgent     #8b6044

  set $border_focus  #72b8cb
  set $border_idle   #4a565e
  set $border_urgent #ffb077

  set $text_focus    #9de4f8
  set $text_idle     #7a8a94
  set $text_urgent   #ffcba4
