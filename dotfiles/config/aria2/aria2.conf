# ╘══════════════════════════════════════════════════════════╛
# dht-listen-port fija los puertos UDP 6888 y 6889 para DHT y UDP tracker.
# El tráfico TCP de BitTorrent usa listen-port, ausente aquí: aria2 elige
# uno del rango por omisión 6881-6999.
# Para inspeccionar solo el tráfico DHT IPv6:
# ❯ sudo tcpdump -i any 'ip6 and udp and (port 6888 or port 6889)'
#
# Puedes revisar estos ajustes; están pensados para servidor
# https://gist.github.com/qzm/a54559726896d5e6bf21adf2363ad334

# ──「 REANUDACIÓN Y GUARDADO 」──────────────────────────────
  auto-file-renaming=false
  auto-save-interval=30
  content-disposition-default-utf8=true
  continue=true
  remote-time=true

# ──「 DISCO 」───────────────────────────────────────────────
  disk-cache=64M
  file-allocation=falloc
  no-file-allocation-limit=8M

# ──「 DESCARGAS PARALELAS (HTTP / FTP) 」────────────────────
  split=4
  min-split-size=8M
  max-connection-per-server=4
  max-concurrent-downloads=3

# ──「 BITTORRENT: SWARM, PEERS Y RED 」──────────────────────
  bt-max-peers=40
  bt-request-peer-speed-limit=2M
# Tiempo de siembra en minutos: 0,16 equivale a unos 9,6 s.
  seed-time=0.16
  dht-listen-port=6888,6889
  enable-dht6=true

# ──「 REINTENTOS 」──────────────────────────────────────────
  retry-wait=5
  max-tries=5

# ──「 CONSOLA Y ESTADO 」────────────────────────────────────
  summary-interval=40
  show-console-readout=true

# ──「 LOGGING 」─────────────────────────────────────────────
  log-level=notice
  console-log-level=error

