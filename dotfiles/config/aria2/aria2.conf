# ╒══════════════════════════════════════════════════════════╕
# │                          ARIA2                           │
# ╘══════════════════════════════════════════════════════════╛
# dht-listen-port fija los puertos UDP 6888 y 6889 para DHT y UDP tracker.
# El tráfico TCP de BitTorrent usa listen-port, ausente aquí: aria2 elige
# uno del rango por omisión 6881-6999.
# Para inspeccionar solo el tráfico DHT IPv6:
# ❯ sudo tcpdump -i any 'ip6 and udp and (port 6888 or port 6889)'
#
# Puedes revisar estos ajustes; están pensados para servidor
# https://gist.github.com/qzm/a54559726896d5e6bf21adf2363ad334

# ──「 REANUDACIÓN Y GUARDADO 」──────────────────────────────
  auto-file-renaming=false
  auto-save-interval=30
  content-disposition-default-utf8=true
  continue=true
  remote-time=true

# ──「 DISCO 」───────────────────────────────────────────────
  disk-cache=64M
  file-allocation=falloc
  no-file-allocation-limit=8M

# ──「 DESCARGAS PARALELAS (HTTP / FTP) 」────────────────────
  split=4
  min-split-size=8M
  max-connection-per-server=4
  max-concurrent-downloads=3

# ──「 BITTORRENT: SWARM, PEERS Y RED 」──────────────────────
  bt-max-peers=40
# 0 evita que la baja velocidad amplíe pares por encima de bt-max-peers.
  bt-request-peer-speed-limit=0
# Ratio 0: la siembra no se corta por ratio, solo por el tiempo indicado.
  seed-ratio=0
# Tiempo de siembra en minutos: 0,16 equivale a unos 9,6 s.
  seed-time=0.16
# TCP fijo, alineado con el UDP de DHT 6888,6889.
  listen-port=6888
  dht-listen-port=6888,6889
  enable-dht6=true
# 20 s para conectar: TCP suele tardar menos de 1 s; esa holgura cubre
# latencia alta sin recortar la respuesta, que conserva su default de 60 s.
  bt-tracker-connect-timeout=20

# ──「 REINTENTOS 」──────────────────────────────────────────
  retry-wait=5
  max-tries=5

# ──「 CONSOLA Y ESTADO 」────────────────────────────────────
  summary-interval=40
  show-console-readout=true

# ──「 LOGGING 」─────────────────────────────────────────────
  log-level=notice
  console-log-level=error

# ──「 TRACKER 」─────────────────────────────────────────────
# NOTE: bt-tracker añade URIs propias a las que trae el torrent.
#       bt-exclude-tracker filtra las URIs del torrent antes de aplicar bt-tracker.
# Fuentes consultadas:
# https://bitbucket.org/xiu2/trackerslistcollection/raw/master/best.txt
# https://github.com/Dahrkael/ExTracker
# https://github.com/ngosang/trackerslist
# https://newtrackon.com/api/stable (fuente de kznet-trackers)
# https://trackerslist.com/
# https://www.nordicnode.com/live-torrent-trackers-every-24h.php
# https://cutie.dating/services.txt
# https://tracker.mywaifu.best/
# https://wepzone.net/Projects/projects.php
# http://open.dstud.io/
# https://lucke.fenesisu.moe/
# https://tracker.tryhackx.org/

# La lista activa la genera kznet-trackers en ~/.cache/aria2/trackers.txt;
# kznet-aria2 la pasa a aria2 con --bt-tracker en cada ejecución.
